<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cookie Clicker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-container">
      <h1>Crazy John Cookie Farm</h1>
      <p>Click the cookie to earn cookies!</p>

      <button id="cookie-button" class="cookie-btn" aria-label="Cookie button">🍪</button>

      <p class="stats">Cookies: <span id="cookie-count">0</span></p>

      <div class="shop">
        <button id="buy-clicker" class="upgrade-btn" type="button">
          Buy Auto Clicker: <span id="autoclicker-cost">15</span>
        </button>
      </div>
    </main>

    <script src="cookies.js" defer></script>
  </body>
</html>
